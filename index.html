<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banquet Event Calendar Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .modal { display: none; opacity: 0; transition: opacity 0.3s ease; }
        .modal.active { display: flex; opacity: 1; }
        
        /* Custom Animation for Cards */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up {
            animation: fadeInUp 0.5s ease-out forwards;
        }

        /* ==========================================
           PRINT STYLES (For A4 Landscape PDF Export)
           ========================================== */
        @media print {
            @page {
                size: A4 landscape;
                margin: 8mm; /* Margin ល្មមសម្រាប់ A4 ផ្តេក */
            }
            
            body {
                background-color: white !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
                font-size: 12px !important;
            }

            /* លាក់ Navbar និង Filter ពេល Print */
            nav, #filterArea, button, .modal, .animate-spin {
                display: none !important;
            }

            .container {
                margin: 0 !important;
                padding: 0 !important;
                max-width: 100% !important;
            }

            /* ចំណងជើងពេល Print លើក្រដាស */
            .container::before {
                content: "INDEPENDENCE HOTEL | F&B BANQUET DASHBOARD (PRINTED REPORT)";
                display: block;
                text-align: center;
                font-size: 22px;
                font-weight: bold;
                color: #1e3a8a;
                margin-bottom: 15px;
                border-bottom: 2px solid #1e3a8a;
                padding-bottom: 10px;
                text-transform: uppercase;
            }

            /* តម្រៀបជា ៣ ជួរស្អាត សម្រាប់ A4 ផ្តេក */
            #eventContainer {
                display: grid !important;
                grid-template-columns: repeat(3, 1fr) !important; 
                gap: 12px !important;
            }

            /* ការពារកុំឲ្យដាច់ Card ពាក់កណ្តាលក្រដាស */
            #eventContainer > div {
                break-inside: avoid !important;
                page-break-inside: avoid !important;
                box-shadow: inset 0 0 0 1px #e2e8f0 !important;
                border: 1px solid #cbd5e1 !important;
                border-left-width: 5px !important;
                animation: none !important;
                transform: none !important;
                opacity: 1 !important;
            }
        }
    </style>
</head>
<body class="bg-gray-50 text-slate-800 font-sans">
    
    <!-- Navbar / Header -->
    <nav class="bg-blue-900 text-white p-4 shadow-md relative flex justify-between items-center h-24 overflow-hidden">
        <h1 class="absolute w-full left-0 text-center font-bold tracking-wider uppercase" style="font-size: 35px; pointer-events: none;">
            INDEPENDENCE HOTEL | F&B BANQUET DASHBOARD
        </h1>
        <div class="ml-auto z-10 flex space-x-4">
            <button class="px-4 py-2 bg-blue-700 text-white rounded font-semibold shadow hover:bg-blue-600 transition duration-300 flex items-center" onclick="fetchEvents()">🔄 Refresh Data</button>
            <button class="bg-white text-blue-900 px-4 py-2 rounded font-semibold shadow hover:bg-blue-100 transition duration-300 flex items-center" onclick="window.print()">🖨️ Export PDF</button>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container mx-auto mt-6 p-4">
        
        <!-- Filter Controls Area -->
        <div id="filterArea" class="bg-white p-4 rounded-lg shadow-sm border mb-6">
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4">
                
                <input type="text" id="searchFilter" placeholder="🔍 Search Group Name..." class="border p-2 rounded text-gray-700 w-full focus:ring-2 focus:ring-blue-500 transition lg:col-span-1" onkeyup="renderEvents()">

                <!-- DATE FILTER (Default = This Week) -->
                <select id="dateFilter" class="border p-2 rounded text-gray-700 w-full focus:ring-2 focus:ring-blue-500 transition lg:col-span-1" onchange="toggleDateRange(); renderEvents();">
                    <option value="all">📅 All Dates</option>
                    <option value="this_week" selected>📅 This Week (Next 7 Days)</option>
                    <option value="this_month">📅 This Month</option>
                    <option value="custom">📅 Custom Date Range</option>
                </select>

                <div id="customDateWrap" class="hidden flex space-x-2 lg:col-span-2">
                    <input type="date" id="startDate" class="border p-2 rounded text-gray-700 w-full" onchange="renderEvents()">
                    <span class="self-center text-gray-500 font-medium">to</span>
                    <input type="date" id="endDate" class="border p-2 rounded text-gray-700 w-full" onchange="renderEvents()">
                </div>

                <select id="statusFilter" class="border p-2 rounded text-gray-700 w-full focus:ring-2 focus:ring-blue-500 transition lg:col-span-1" onchange="renderEvents()">
                    <option value="all">✅ All Events</option>
                    <option value="confirmed">🟢 Confirmed Group Only</option>
                    <option value="unconfirmed">🟠 All Unconfirmed Status</option>
                </select>

                <select id="venueFilter" class="border p-2 rounded text-gray-700 w-full focus:ring-2 focus:ring-blue-500 transition lg:col-span-1" onchange="renderEvents()">
                    <option value="all">📍 All Venues</option>
                    <option value="hibiscus">Hibiscus Room</option>
                    <option value="camellia">Camellia Room</option>
                    <option value="jasmine">Jasmine Room</option>
                    <option value="champa">Champa Room</option>
                    <option value="sky pool">Sky Pool & Poolside</option>
                    <option value="sunset">Sunset Restaurant</option>
                    <option value="coral">Coral Restaurant</option>
                    <option value="history">History Bar</option>
                    <option value="beach">Beach</option>
                </select>
                
            </div>
        </div>

        <!-- Event List View -->
        <div class="bg-white shadow rounded-lg p-6 min-h-[400px]" style="box-shadow: none; border: none; padding: 0;">
            <div id="eventContainer" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
                <!-- Loader Placeholder -->
                <div class="col-span-full text-center py-12">
                    <div class="animate-spin inline-block w-8 h-8 border-[3px] border-current border-t-transparent text-blue-600 rounded-full" role="status"></div>
                    <p class="mt-2 text-gray-500 font-medium">Loading events from Google Sheets...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal for Event Details -->
    <div id="eventModal" class="modal fixed inset-0 bg-black bg-opacity-60 justify-center items-center z-50">
        <div class="bg-white p-8 rounded-lg shadow-2xl max-w-md w-full m-4 transform scale-100 transition-transform duration-300 relative">
            <button class="absolute top-4 right-4 text-gray-400 hover:text-red-500 font-bold text-xl" onclick="closeModal()">✕</button>
            <h3 id="modalTitle" class="text-2xl font-bold text-blue-900 mb-2 border-b pb-2">Event Name</h3>
            <p id="modalDate" class="text-gray-600 mb-4 font-semibold mt-2"></p>
            <div class="space-y-3 mb-6 bg-gray-50 p-4 rounded-lg border">
                <p class="flex justify-between border-b pb-1"><strong>Res. Code:</strong> <span id="modalCode" class="text-gray-700"></span></p>
                <p class="flex justify-between border-b pb-1"><strong>Venue & Type:</strong> <span id="modalVenue" class="text-gray-700 text-right font-medium"></span></p>
                <p class="flex justify-between border-b pb-1"><strong>Pax:</strong> <span id="modalPax" class="text-gray-700 font-bold bg-white px-2 border rounded"></span></p>
                <p class="flex justify-between"><strong>Status:</strong> <span id="modalStatus" class="font-bold uppercase tracking-wider"></span></p>
            </div>
            <button class="bg-blue-900 hover:bg-blue-800 text-white px-4 py-3 rounded-lg w-full font-bold transition-colors shadow-md" onclick="closeModal()">Close Details</button>
        </div>
    </div>

    <script>
        // System Error Catcher - Auto reports any JS bug to screen
        window.onerror = function(message, source, lineno) {
            const container = document.getElementById('eventContainer');
            if (container) {
                container.innerHTML = `
                <div class="col-span-full bg-red-100 text-red-800 p-6 rounded-lg text-left border border-red-300">
                    <h3 class="font-bold text-lg mb-2">❌ JavaScript Error Detected:</h3>
                    <p><strong>Message:</strong> ${message}</p>
                    <p><strong>Line:</strong> ${lineno}</p>
                </div>`;
            }
        };

        const API_URL = 'https://script.google.com/macros/s/AKfycbw1F7SsSLEazvkYlZ0RZZ3D7Xzu8heAJh8xYBEQx5bB6WSkejYVY6jDJJrmqy9DdZVN4g/exec';
        let eventsData = [];

        async function fetchEvents() {
            const container = document.getElementById('eventContainer');
            container.innerHTML = `
                <div class="col-span-full text-center py-12">
                    <div class="animate-spin inline-block w-8 h-8 border-[3px] border-current border-t-transparent text-blue-600 rounded-full"></div>
                    <p class="mt-3 text-gray-500 font-medium">Refreshing data from Server...</p>
                </div>`;

            try {
                const response = await fetch(API_URL, { redirect: 'follow' });
                if (!response.ok) throw new Error('Network response failed: ' + response.status);
                
                eventsData = await response.json();
                
                if(Array.isArray(eventsData)) {
                    eventsData.sort((a, b) => new Date(a.date) - new Date(b.date));
                }
                
                renderEvents();
                
            } catch (error) {
                container.innerHTML = `
                <div class="col-span-full bg-red-50 p-6 rounded-lg text-red-600 text-center border border-red-200 shadow-sm">
                    <h3 class="font-bold text-lg mb-1">❌ Connection Error</h3>
                    <p class="text-sm mt-2 font-medium">${error.message}</p>
                    <p class="text-sm mt-1">សូមប្រាកដថា Google Script Web App ត្រូវបានសិទ្ធិជា 'Anyone' និង URL ត្រឹមត្រូវ។</p>
                </div>`;
            }
        }

        function toggleDateRange() {
            const dateFilter = document.getElementById('dateFilter').value;
            const customWrap = document.getElementById('customDateWrap');
            if(dateFilter === 'custom') {
                customWrap.classList.remove('hidden');
                customWrap.classList.add('lg:col-span-2'); 
            } else {
                customWrap.classList.add('hidden');
                customWrap.classList.remove('lg:col-span-2');
            }
        }

        function renderEvents() {
            const container = document.getElementById('eventContainer');
            
            const searchFilter = (document.getElementById('searchFilter').value || '').toLowerCase();
            const venueFilter = (document.getElementById('venueFilter').value || '').toLowerCase();
            const statusFilter = document.getElementById('statusFilter').value;
            const dateFilter = document.getElementById('dateFilter').value;
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            
            container.innerHTML = '';

            const today = new Date();
            today.setHours(0,0,0,0);
            const next7Days = new Date(today);
            next7Days.setDate(today.getDate() + 7);

            // Timezone safe parsing for custom dates
            const filterStart = startDate ? new Date(startDate + "T00:00:00") : null;
            const filterEnd = endDate ? new Date(endDate + "T23:59:59") : null;

            const filteredEvents = (eventsData || []).filter(ev => {
                const evGroup = (ev.groupName || '').toString().toLowerCase();
                const evLoc = (ev.location || '').toString().toLowerCase();
                const evStatus = (ev.status || '').toString().toLowerCase();

                if (searchFilter && !evGroup.includes(searchFilter)) return false;
                if (venueFilter !== 'all' && !evLoc.includes(venueFilter)) return false;
                
                const isConfirmed = evStatus.includes('confirm');
                if (statusFilter === 'confirmed' && !isConfirmed) return false;
                if (statusFilter === 'unconfirmed' && isConfirmed) return false;

                if(!ev.date) return false;
                const evDate = new Date(ev.date);
                evDate.setHours(0,0,0,0);

                if (dateFilter === 'this_week' && (evDate < today || evDate > next7Days)) return false;
                if (dateFilter === 'this_month' && (evDate.getMonth() !== today.getMonth() || evDate.getFullYear() !== today.getFullYear())) return false;
                if (dateFilter === 'custom') {
                    if (filterStart && evDate < filterStart) return false;
                    if (filterEnd && evDate > filterEnd) return false;
                }

                return true;
            });

            if (filteredEvents.length === 0) {
                container.innerHTML = `
                <div class="col-span-full flex flex-col items-center justify-center py-16 text-gray-400">
                    <svg class="w-16 h-16 mb-4 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <p class="text-xl font-medium text-gray-500">No events match your criteria</p>
                </div>`;
                return;
            }

            filteredEvents.forEach((ev, index) => {
                const evStatus = (ev.status || '').toString().toLowerCase();
                const isConfirmed = evStatus.includes('confirm');
                
                // Color Logic
                const bgColor = isConfirmed ? 'bg-green-50 border-green-500' : 'bg-orange-50 border-orange-400';
                const badgeColor = isConfirmed ? 'bg-green-100 text-green-800 border-green-300' : 'bg-orange-100 text-orange-800 border-orange-300';
                const dateTextColor = isConfirmed ? 'text-green-700' : 'text-blue-700';

                let fullDateStr = "TBA";
                let bigDay = "--";
                let bigMonth = "";
                let shortDayName = "---";

                if(ev.date) {
                    const d = new Date(ev.date);
                    if(!isNaN(d)) {
                        fullDateStr = d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
                        bigDay = d.getDate();
                        bigMonth = d.toLocaleDateString('en-GB', { month: 'short' }).toUpperCase();
                        shortDayName = d.toLocaleDateString('en-GB', { weekday: 'short' }).toUpperCase();
                    }
                }

                // Combine Outlet and Event Type Safely
                let outletString = (ev.location || 'TBA').toString().toUpperCase();
                let evType = (ev.type || '').toString().trim().toUpperCase();
                
                if (evType && evType !== "-" && evType !== "N/A" && evType !== "NULL") {
                    outletString += ` | ${evType}`;
                }

                const card = document.createElement('div');
                card.className = `relative border-l-[5px] p-5 rounded-lg shadow-sm cursor-pointer hover:-translate-y-1 hover:shadow-lg transition-all duration-300 animate-fade-in-up flex flex-col ${bgColor}`;
                card.style.opacity = '0';
                card.style.animationDelay = `${index * 0.05}s`; 
                card.onclick = () => openModal(index, filteredEvents);
                
                card.innerHTML = `
                    <!-- Big Date & Day Name on Top Right -->
                    <div class="absolute top-4 right-5 text-center flex flex-col items-center justify-center min-w-[55px]">
                        <span class="text-sm font-extrabold ${dateTextColor} tracking-widest uppercase mb-1">${shortDayName}</span>
                        <span class="text-4xl font-black text-blue-900 leading-none">${bigDay}</span>
                        <span class="text-xs font-bold text-gray-500 tracking-widest mt-1.5">${bigMonth}</span>
                    </div>

                    <!-- Card Content -->
                    <div class="pr-[70px] flex-grow">
                        <p class="text-[10px] text-gray-500 font-extrabold uppercase tracking-widest mb-1">GROUP NAME:</p>
                        <h4 class="font-bold text-lg text-blue-900 leading-tight mb-4 uppercase">${ev.groupName || 'UNNAMED EVENT'}</h4>
                        
                        <p class="text-sm text-gray-700 mb-2 flex items-start">
                            <span class="font-bold text-gray-900 uppercase text-[11px] tracking-wider inline-block w-[70px] flex-shrink-0 mt-0.5">OUTLET:</span> 
                            <span class="font-semibold text-gray-800 leading-tight">${outletString}</span>
                        </p>
                        
                        <p class="text-sm text-gray-700 mb-2 flex items-center">
                            <span class="font-bold text-gray-900 uppercase text-[11px] tracking-wider inline-block w-[70px] flex-shrink-0">DATE:</span> 
                            <span class="font-semibold text-blue-700">${fullDateStr}</span> 
                            <span class="mx-2 text-gray-300">|</span> 
                            <span class="font-bold text-gray-900 uppercase text-[11px] tracking-wider mr-2">TIME:</span> 
                            <span class="font-semibold text-gray-800">${ev.time || 'TBA'}</span>
                        </p>

                        <p class="text-sm text-gray-700 mb-4 flex items-center">
                            <span class="font-bold text-gray-900 uppercase text-[11px] tracking-wider inline-block w-[70px] flex-shrink-0">PAX:</span> 
                            <span class="font-bold text-gray-800 bg-white px-2.5 py-0.5 rounded border border-gray-200 shadow-sm">${ev.pax || '?'}</span>
                        </p>
                    </div>

                    <!-- Bottom Status -->
                    <div class="mt-auto border-t border-gray-200 pt-3">
                        <span class="text-xs font-bold px-3 py-1.5 rounded border uppercase tracking-widest inline-block ${badgeColor}">
                            ${ev.status || 'NO STATUS'}
                        </span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function openModal(index, dataArray) {
            const ev = dataArray[index];
            
            let displayDate = "TBA";
            if(ev.date) {
                const d = new Date(ev.date);
                if(!isNaN(d)) displayDate = d.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
            }

            let outletString = (ev.location || 'TBA').toString().toUpperCase();
            let evType = (ev.type || '').toString().trim().toUpperCase();
            if (evType && evType !== "-" && evType !== "N/A" && evType !== "NULL") {
                outletString += ` | ${evType}`;
            }

            document.getElementById('modalTitle').innerText = (ev.groupName || 'UNNAMED EVENT').toUpperCase();
            document.getElementById('modalDate').innerText = `📅 ${displayDate} | ⏰ ${ev.time}`;
            document.getElementById('modalCode').innerText = ev.reservationCode || 'N/A';
            document.getElementById('modalVenue').innerText = outletString;
            document.getElementById('modalPax').innerText = ev.pax || 'TBA';
            document.getElementById('modalStatus').innerText = ev.status || 'UNKNOWN';
            
            const isConfirmed = (ev.status || '').toLowerCase().includes('confirm');
            document.getElementById('modalStatus').className = isConfirmed ? 'text-green-600 font-bold uppercase tracking-widest' : 'text-orange-500 font-bold uppercase tracking-widest';

            document.getElementById('eventModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('eventModal').classList.remove('active');
        }

        window.onclick = function(event) {
            const modal = document.getElementById('eventModal');
            if (event.target == modal) {
                closeModal();
            }
        }

        // Initialize Call
        fetchEvents();
    </script>
</body>
</html>
