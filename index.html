<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Banquet Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Kantumruy+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
@property --angle { syntax: '<angle>'; initial-value: 0deg; inherits: false; }

:root {
  --navy:#0b1f4d; --blue:#2563eb; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0;
  --green:#16a34a; --green-bg:#ecfdf5;
  --amber:#d97706; --amber-bg:#fffbeb;
  --red:#dc2626;   --red-bg:#fef2f2;
  --slate:#475569; --slate-bg:#f1f5f9;
  --sky:#2563eb;   --sky-bg:#eff6ff;
  --gold:#fbbf24;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: 'Inter','Kantumruy Pro','Noto Sans Khmer','Khmer OS',system-ui,sans-serif;
  color: var(--ink);
  background:
    radial-gradient(1200px 600px at 8% -10%, #dbeafe 0, transparent 60%),
    radial-gradient(900px 500px at 100% 115%, #fef3c7 0, transparent 55%),
    #f1f5f9;
  -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; }
.app { height: 100vh; height: 100dvh; display: flex; flex-direction: column; }

/* ---------- Header ---------- */
.top {
  position: relative; z-index: 5;
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: 10px 20px; color: #fff;
  background: linear-gradient(110deg, #0b1f4d, #1d4ed8, #0b1f4d);
  background-size: 200% 100%;
  animation: hue 14s ease-in-out infinite alternate;
  box-shadow: 0 6px 24px rgba(11,31,77,.25);
}
@keyframes hue { to { background-position: 100% 0; } }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.logo {
  width: 42px; height: 42px; flex: none; border-radius: 12px; display: grid; place-items: center;
  background: rgba(255,255,255,.14); font-size: 22px; backdrop-filter: blur(4px);
  animation: float 4s ease-in-out infinite;
}
@keyframes float { 50% { transform: translateY(-3px); } }
.title {
  font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
  font-size: clamp(14px, 1.8vw, 24px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.title small { display: block; font-size: 11px; font-weight: 600; letter-spacing: .22em; color: #bfdbfe; }
.actions { display: flex; gap: 10px; flex: none; }
.btn {
  display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
  border: 1px solid rgba(255,255,255,.28); background: rgba(255,255,255,.12); color: #fff;
  font-weight: 700; font-size: 13px; line-height: 1; padding: 10px 14px; border-radius: 10px;
  transition: transform .2s, background .2s, box-shadow .2s;
}
.btn:hover { background: rgba(255,255,255,.22); transform: translateY(-2px); box-shadow: 0 8px 18px rgba(0,0,0,.2); }
.btn:active { transform: translateY(0) scale(.97); }
.btn.solid { background: #fff; color: var(--navy); border-color: #fff; }
.btn.solid:hover { background: #eff6ff; }
.btn .ic { display: inline-block; }
.btn.loading .ic { animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- Toolbar ---------- */
.toolbar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px;
  padding: 9px 20px; background: rgba(255,255,255,.78); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line); position: relative; z-index: 6;
}

/* Segmented layout switch */
.seg { position: relative; display: inline-grid; grid-template-columns: 1fr 1fr; padding: 4px; border-radius: 13px; background: #e8edf5; box-shadow: inset 0 1px 3px rgba(15,23,42,.1); }
.seg-b {
  position: relative; z-index: 1; border: 0; background: transparent; cursor: pointer; padding: 8px 16px;
  font-size: 13px; font-weight: 800; letter-spacing: .02em; color: #64748b; border-radius: 10px; white-space: nowrap;
  transition: color .25s;
}
.seg-b:hover { color: var(--navy); }
.seg-b[aria-selected="true"] { color: var(--navy); }
.seg-thumb {
  position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc(50% - 4px); border-radius: 10px; background: #fff;
  box-shadow: 0 2px 8px rgba(15,23,42,.18), 0 0 0 1px rgba(15,23,42,.04);
  transition: transform .35s cubic-bezier(.3,1.35,.5,1), opacity .25s;
}
.seg[data-active="month"] .seg-thumb { transform: translateX(100%); }
.seg[data-active="none"] .seg-thumb { opacity: 0; }

/* Navigation */
.weeknav { display: flex; align-items: center; gap: 6px; }
.weeknav.off { display: none; }
.nbtn {
  height: 36px; min-width: 36px; padding: 0 12px; border-radius: 10px; cursor: pointer;
  border: 1px solid var(--line); background: #fff; color: var(--navy); font-weight: 800; font-size: 14px;
  transition: transform .18s, box-shadow .18s, background .18s;
}
.nbtn:hover { transform: translateY(-2px); box-shadow: 0 6px 14px rgba(15,23,42,.12); background: #eff6ff; }
.nbtn:active { transform: scale(.94); }
.nbtn.today { background: var(--navy); color: #fff; border-color: var(--navy); font-size: 12px; letter-spacing: .06em; }
.nbtn.today:hover { background: #12306f; }
.weeklabel { min-width: 190px; text-align: center; font-weight: 800; font-size: 15px; color: var(--navy); }
.weeklabel small { display: block; font-size: 10px; font-weight: 700; letter-spacing: .2em; color: var(--muted); }
.swap { animation: swap .35s cubic-bezier(.2,.8,.2,1); }
@keyframes swap { from { opacity: 0; transform: translateY(6px); } }

/* Custom range button + popover */
.range-wrap { position: relative; display: inline-flex; align-items: center; }
.rbtn {
  display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; cursor: pointer; border-radius: 12px;
  border: 1.5px dashed #93b4f5; background: #fff; color: var(--blue); font-weight: 800; font-size: 13px;
  transition: transform .2s, box-shadow .2s, background .2s, border-color .2s;
}
.rbtn:hover { transform: translateY(-2px); box-shadow: 0 8px 18px rgba(37,99,235,.18); background: #eff6ff; }
.rbtn.active { border: 1.5px solid transparent; color: #fff; background: linear-gradient(120deg, #2563eb, #4f46e5); box-shadow: 0 8px 20px rgba(79,70,229,.35); padding-right: 40px; }
.rclear {
  position: absolute; right: 6px; top: 50%; width: 28px; height: 28px; margin-top: -14px; border: 0; border-radius: 50%; cursor: pointer;
  background: rgba(255,255,255,.25); color: #fff; font-size: 13px; font-weight: 800; display: none; transition: transform .25s, background .2s;
}
.rbtn.active ~ .rclear { display: block; animation: spring .35s cubic-bezier(.2,1.4,.3,1) both; }
.rclear:hover { background: rgba(255,255,255,.45); transform: rotate(90deg); }

.pop {
  display: none; position: absolute; top: calc(100% + 12px); left: 0; width: 360px; max-width: calc(100vw - 24px); z-index: 40;
  padding: 16px; border-radius: 18px; background: #fff; border: 1px solid var(--line);
  box-shadow: 0 30px 70px rgba(15,23,42,.28); transform-origin: 24px -8px;
}
.pop::before { content: ''; position: absolute; top: -7px; left: 30px; width: 14px; height: 14px; background: #fff; border-left: 1px solid var(--line); border-top: 1px solid var(--line); transform: rotate(45deg); }
.pop.open { display: block; animation: spring .35s cubic-bezier(.2,1.2,.3,1) both; }
.pop-t { font-size: 13px; font-weight: 900; letter-spacing: .14em; text-transform: uppercase; color: var(--navy); margin-bottom: 10px; }
.presets { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.presets button {
  border: 1px solid var(--line); background: #f8fafc; color: #334155; border-radius: 99px; padding: 6px 11px; cursor: pointer;
  font-size: 12px; font-weight: 700; transition: transform .15s, background .15s, color .15s, border-color .15s;
}
.presets button:hover { background: #dbeafe; border-color: #93c5fd; color: var(--navy); transform: translateY(-1px); }
.presets button.on { background: var(--navy); border-color: var(--navy); color: #fff; }
.dates { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: end; }
.dates label { display: flex; flex-direction: column; gap: 4px; font-size: 10px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.dates input {
  height: 40px; border: 1px solid var(--line); border-radius: 10px; padding: 0 8px; font: 700 13px 'Inter', system-ui, sans-serif; color: #1e293b; background: #fff; outline: none; min-width: 0;
  transition: box-shadow .2s, border-color .2s;
}
.dates input:focus { border-color: var(--blue); box-shadow: 0 0 0 4px rgba(37,99,235,.15); }
.dates .arrow { padding-bottom: 10px; color: #94a3b8; font-weight: 800; }
.pop-info { min-height: 20px; margin: 10px 2px 2px; font-size: 12px; font-weight: 700; color: var(--muted); }
.pop-info.bad { color: var(--red); }
.pop-info b { color: var(--navy); }
.pop-act { display: flex; gap: 8px; margin-top: 8px; }
.pbtn { flex: 1; height: 42px; border: 0; border-radius: 12px; cursor: pointer; font-weight: 800; font-size: 13px; background: linear-gradient(120deg, #2563eb, #4f46e5); color: #fff; transition: transform .2s, box-shadow .2s; }
.pbtn:hover { transform: translateY(-2px); box-shadow: 0 8px 18px rgba(79,70,229,.4); }
.pbtn:active { transform: scale(.97); }
.pbtn.ghost { flex: none; padding: 0 16px; background: #f1f5f9; color: #475569; }
.pbtn.ghost:hover { box-shadow: none; background: #e2e8f0; }

.stats { display: flex; gap: 8px; }
.stat {
  display: flex; align-items: baseline; gap: 6px; padding: 6px 12px; border-radius: 10px;
  background: #fff; border: 1px solid var(--line); font-size: 11px; font-weight: 700; color: var(--muted);
  letter-spacing: .06em; text-transform: uppercase;
}
.stat b { font-size: 18px; font-weight: 900; color: var(--ink); letter-spacing: 0; font-variant-numeric: tabular-nums; }
.stat.g b { color: var(--green); } .stat.a b { color: var(--amber); }
.filters { display: flex; gap: 8px; flex: 1; justify-content: flex-end; flex-wrap: wrap; align-items: center; }
.filters input[type="search"], .filters select {
  height: 36px; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: #334155;
  padding: 0 12px; font: 600 13px 'Inter','Kantumruy Pro',system-ui,sans-serif; outline: none; transition: box-shadow .2s, border-color .2s;
}
.filters input[type="search"] { width: 170px; }
.filters input:focus, .filters select:focus { border-color: var(--blue); box-shadow: 0 0 0 4px rgba(37,99,235,.15); }
.switch { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; color: #475569; cursor: pointer; user-select: none; }
.switch input { display: none; }
.switch i { width: 38px; height: 22px; border-radius: 99px; background: #cbd5e1; position: relative; transition: background .25s; }
.switch i::after { content: ''; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.3); transition: transform .25s cubic-bezier(.3,1.6,.5,1); }
.switch input:checked + i { background: var(--blue); }
.switch input:checked + i::after { transform: translateX(16px); }
.updated { align-self: center; font-size: 11px; font-weight: 700; letter-spacing: .04em; color: #bfdbfe; white-space: nowrap; }
.err {
  margin: 10px 20px 0; padding: 10px 14px; border-radius: 12px; background: var(--red-bg); color: #991b1b;
  border: 1px solid #fecaca; font-size: 13px; font-weight: 600; animation: dropIn .4s ease both;
}
.err[hidden] { display: none; }
@keyframes dropIn { from { opacity: 0; transform: translateY(-10px); } }

/* ---------- Main + grids ---------- */
main { flex: 1; min-height: 0; padding: 14px 20px 18px; display: flex; flex-direction: column; gap: 8px; }
.legend { display: none; gap: 14px; flex-wrap: wrap; font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .04em; padding: 0 2px; }
.legend.show { display: flex; animation: swap .35s ease both; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

#grid {
  flex: 1; min-height: 0; display: grid; gap: 14px;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  grid-template-rows: repeat(2, minmax(0, 1fr));
}
#grid.month { grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
#grid.rg {
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); grid-template-rows: none; grid-auto-rows: min-content;
  align-content: start; overflow-y: auto; padding: 4px 6px 18px; margin: 0 -6px; scrollbar-width: thin; scrollbar-color: #cbd5e1 transparent;
}
#grid.rg .evs { overflow: visible; flex: none; }
#grid.rg .day { min-height: 190px; }

.day {
  position: relative; display: flex; flex-direction: column; min-height: 0;
  background: rgba(255,255,255,.92); border: 1px solid var(--line); border-radius: 18px;
  box-shadow: 0 2px 6px rgba(15,23,42,.05), 0 10px 26px rgba(15,23,42,.05);
  animation: pop .6s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i) * 60ms);
  transition: transform .25s, box-shadow .25s;
}
.day:hover { transform: translateY(-3px); box-shadow: 0 4px 10px rgba(15,23,42,.06), 0 18px 36px rgba(15,23,42,.1); }
@keyframes pop { from { opacity: 0; transform: translate(var(--dx, 0px), 22px) scale(.95); } }
.day.weekend { background: linear-gradient(180deg, #fff1f2 0, rgba(255,255,255,.92) 90px); }
.day.past .dnum { color: #94a3b8; }
.day.past .evs { opacity: .78; }
.day.today { border-color: var(--blue); background: linear-gradient(180deg, #dbeafe 0, rgba(255,255,255,.95) 100px); }
.day.today::after {
  content: ''; position: absolute; inset: -2px; border-radius: 19px; border: 2px solid var(--blue);
  pointer-events: none; animation: glow 2.4s ease-in-out infinite;
}
@keyframes glow { 0% { box-shadow: 0 0 0 0 rgba(37,99,235,.45); } 70%,100% { box-shadow: 0 0 0 12px rgba(37,99,235,0); } }

.day-h { display: flex; align-items: center; gap: 10px; padding: 11px 14px 8px; }
.dnum { font-size: 38px; font-weight: 900; line-height: 1; color: var(--navy); font-variant-numeric: tabular-nums; }
.dmeta { display: flex; flex-direction: column; line-height: 1.2; }
.dow { font-size: 13px; font-weight: 800; letter-spacing: .18em; color: var(--blue); }
.weekend .dow { color: #e11d48; }
.dmon { font-size: 11px; font-weight: 700; letter-spacing: .16em; color: var(--muted); }
.cnt {
  margin-left: auto; min-width: 26px; height: 26px; padding: 0 8px; display: grid; place-items: center;
  border-radius: 99px; font-size: 12px; font-weight: 800; color: #fff; background: var(--navy);
}
.cnt.gold { background: var(--gold); color: #422006; }
.badge-today {
  margin-left: auto; font-size: 10px; font-weight: 800; letter-spacing: .14em; padding: 4px 9px;
  border-radius: 99px; background: var(--blue); color: #fff; animation: bounce 1.8s ease-in-out infinite;
}
.badge-today + .cnt { margin-left: 6px; }
@keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }

.evs {
  flex: 1; min-height: 0; overflow-y: auto; padding: 2px 10px 10px; display: flex; flex-direction: column; gap: 8px;
  scrollbar-width: thin; scrollbar-color: #cbd5e1 transparent;
}
.evs::-webkit-scrollbar { width: 6px; } .evs::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9px; }
.hidden-note { margin-top: auto; text-align: center; font-size: 10px; font-weight: 700; letter-spacing: .06em; color: #94a3b8; padding-top: 2px; }

/* Event card */
.ev {
  position: relative; flex: none; padding: 8px 10px 8px 12px; border-radius: 12px; cursor: pointer; outline: none;
  background: var(--bg); border: 1px solid rgba(15,23,42,.06); border-left: 4px solid var(--c);
  animation: evIn .5s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i, 0) * 60ms + var(--j) * 70ms + 160ms);
  transition: transform .2s, box-shadow .2s;
}
.ev:hover, .ev:focus-visible { transform: translateX(4px) scale(1.015); box-shadow: 0 8px 20px rgba(15,23,42,.14); }
.ev:focus-visible { box-shadow: 0 0 0 3px rgba(37,99,235,.4); }
@keyframes evIn { from { opacity: 0; transform: translateX(-14px); } }
.st-confirmed { --c: var(--green); --bg: var(--green-bg); }
.st-prospect  { --c: var(--amber); --bg: var(--amber-bg); }
.st-cancelled { --c: var(--red);   --bg: var(--red-bg); }
.st-block     { --c: var(--slate); --bg: repeating-linear-gradient(45deg, #f1f5f9, #f1f5f9 6px, #e7ecf3 6px, #e7ecf3 12px); }
.st-none      { --c: var(--sky);   --bg: var(--sky-bg); }
.st-other     { --c: #7c3aed;      --bg: #f5f3ff; }
.st-cancelled .ev-name { text-decoration: line-through; color: #7f1d1d; }
.st-cancelled, .st-block { opacity: .85; }
.ev-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.ev-time { font-size: 12px; font-weight: 800; color: var(--c); font-variant-numeric: tabular-nums; }
.pill {
  display: inline-flex; align-items: center; font-size: 9px; font-weight: 800; letter-spacing: .09em;
  padding: 2px 8px; border-radius: 99px; color: var(--c); background: #fff; border: 1px solid var(--c); white-space: nowrap;
}
.st-confirmed .pill::before {
  content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--c); margin-right: 5px; animation: ping 1.8s infinite;
}
@keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(22,163,74,.6); } 80%,100% { box-shadow: 0 0 0 6px rgba(22,163,74,0); } }
.ev-name {
  margin: 3px 0 2px; font-size: 13px; font-weight: 800; line-height: 1.25; color: var(--navy); text-transform: uppercase;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.ev-meta { display: flex; justify-content: space-between; gap: 8px; font-size: 11px; font-weight: 600; color: #475569; }
.ev-where { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.ev-pax { flex: none; font-weight: 800; color: #1e293b; }

/* ---------- Month view ---------- */
.mh { text-align: center; font-size: 12px; font-weight: 900; letter-spacing: .22em; color: var(--muted); padding: 2px 0 4px; animation: swap .4s ease both; }
.mh.we { color: #e11d48; }
.mc {
  position: relative; display: flex; flex-direction: column; min-height: 0; overflow: hidden; padding: 6px 6px 5px;
  background: rgba(255,255,255,.92); border: 1px solid var(--line); border-radius: 14px;
  box-shadow: 0 1px 3px rgba(15,23,42,.05);
  animation: pop .5s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i) * 12ms);
  transition: transform .2s, box-shadow .2s, border-color .2s;
}
.mc.has { cursor: pointer; }
.mc.has:hover { transform: translateY(-3px); box-shadow: 0 12px 26px rgba(15,23,42,.14); border-color: #93b4f5; }
.mc.we { background: linear-gradient(180deg, #fff1f2, rgba(255,255,255,.92) 60px); }
.mc.out { opacity: .5; background: #f8fafc; }
.mc.past .mc-n { color: #94a3b8; }
.mc.today { border-color: var(--blue); background: linear-gradient(180deg, #dbeafe, rgba(255,255,255,.95) 70px); }
.mc.today::after { content: ''; position: absolute; inset: -1px; border-radius: 14px; border: 2px solid var(--blue); pointer-events: none; animation: glow 2.4s ease-in-out infinite; }
.mc-h { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
.mc-n { font-size: 17px; font-weight: 900; color: var(--navy); font-variant-numeric: tabular-nums; line-height: 1; }
.mc-n small { font-size: 9px; font-weight: 800; letter-spacing: .12em; color: var(--blue); margin-left: 4px; }
.mc.today .mc-n { color: var(--blue); }
.mc-cnt { min-width: 20px; height: 20px; padding: 0 6px; display: grid; place-items: center; border-radius: 99px; font-size: 11px; font-weight: 800; color: #fff; background: var(--navy); }
.mc-evs { display: flex; flex-direction: column; gap: 3px; min-height: 0; }
.mchip {
  flex: none; display: block; padding: 3px 6px; border-radius: 7px; cursor: pointer; font-size: 11px; font-weight: 700; line-height: 1.25;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #1e293b; background: var(--bg); border-left: 3px solid var(--c);
  transition: transform .15s, box-shadow .15s;
}
.mchip:hover { transform: translateX(2px); box-shadow: 0 3px 10px rgba(15,23,42,.18); }
.mchip b { color: var(--c); font-weight: 900; margin-right: 4px; font-variant-numeric: tabular-nums; }
.mchip.st-cancelled { text-decoration: line-through; opacity: .7; }
.mc-more { margin-top: 2px; font-size: 10px; font-weight: 800; letter-spacing: .04em; color: var(--blue); padding: 0 4px; }

/* ---------- Range summary ---------- */
.rsum {
  grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 20px;
  padding: 14px 18px; border-radius: 16px; color: #fff; background: linear-gradient(120deg, #1e3a8a, #4338ca);
  box-shadow: 0 10px 28px rgba(67,56,202,.3); animation: pop .5s cubic-bezier(.2,.8,.2,1) both;
}
.rsum-t { font-size: 17px; font-weight: 900; letter-spacing: .04em; }
.rsum-t small { margin-left: 8px; font-size: 11px; font-weight: 700; letter-spacing: .14em; color: #c7d2fe; }
.rsum-s { display: flex; flex-wrap: wrap; gap: 8px; }
.rsum-s span { padding: 5px 12px; border-radius: 99px; background: rgba(255,255,255,.14); font-size: 12px; font-weight: 700; color: #e0e7ff; }

.rempty { grid-column: 1 / -1; display: grid; place-content: center; text-align: center; gap: 6px; padding: 50px 20px; color: #94a3b8; font-weight: 700; }

/* ---------- Highlight box (upcoming week, confirmed) ---------- */
.hl {
  position: relative; display: flex; flex-direction: column; min-height: 0; overflow: hidden; color: #fff; border-radius: 18px;
  background: linear-gradient(160deg, #0b1f4d 0%, #1e3a8a 58%, #312e81 100%);
  box-shadow: 0 14px 36px rgba(30,58,138,.38);
  animation: pop .6s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i) * 60ms);
}
.hl::before {
  content: ''; position: absolute; inset: 0; border-radius: inherit; padding: 2.5px; pointer-events: none; z-index: 2;
  background: conic-gradient(from var(--angle), #fbbf24, #3b82f6, #22c55e, #f472b6, #fbbf24);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); mask-composite: exclude;
  animation: rot 6s linear infinite;
}
@keyframes rot { to { --angle: 360deg; } }
.hl::after {
  content: ''; position: absolute; top: 0; left: -60%; width: 38%; height: 100%; pointer-events: none; z-index: 1;
  background: linear-gradient(100deg, transparent, rgba(255,255,255,.16), transparent); transform: skewX(-20deg);
  animation: shine 5.5s ease-in-out infinite;
}
@keyframes shine { 0%,55% { left: -60%; } 100% { left: 135%; } }
.hl-h { position: relative; z-index: 3; display: flex; align-items: center; gap: 10px; padding: 13px 14px 8px; }
.hl-star { font-size: 26px; animation: twinkle 2.4s ease-in-out infinite; }
@keyframes twinkle { 0%,100% { transform: scale(1) rotate(0); } 50% { transform: scale(1.18) rotate(14deg); } }
.hl-t { font-size: 14px; font-weight: 900; letter-spacing: .16em; color: var(--gold); }
.hl-s { font-size: 11px; font-weight: 600; color: #bfdbfe; letter-spacing: .04em; }
.hl-list { position: relative; z-index: 3; flex: 1; min-height: 0; overflow-y: auto; padding: 2px 10px 12px; display: flex; flex-direction: column; gap: 8px; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.3) transparent; }
.grp {
  padding: 9px 12px; border-radius: 13px; cursor: pointer; outline: none;
  background: rgba(255,255,255,.09); border: 1px solid rgba(255,255,255,.18);
  animation: evIn .5s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i) * 60ms + var(--j) * 90ms + 200ms);
  transition: transform .2s, background .2s;
}
.grp:hover, .grp:focus-visible { background: rgba(255,255,255,.18); transform: translateX(4px); }
.grp-name { font-size: 13px; font-weight: 800; text-transform: uppercase; line-height: 1.25; }
.grp-sub { margin-top: 2px; font-size: 11px; font-weight: 600; color: #bfdbfe; }
.grp-days { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
.chip { font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 8px; color: #fde68a; background: rgba(251,191,36,.16); border: 1px solid rgba(251,191,36,.45); }
.chip b { color: #fff; margin-left: 4px; }
.hl-empty { position: relative; z-index: 3; flex: 1; display: grid; place-content: center; text-align: center; gap: 8px; padding: 20px; color: #bfdbfe; font-weight: 600; font-size: 13px; }
.hl-empty .sp { font-size: 34px; animation: twinkle 2.4s ease-in-out infinite; }

/* ---------- Skeleton ---------- */
.sk { border-radius: 18px; background: linear-gradient(100deg, #e2e8f0 30%, #f8fafc 50%, #e2e8f0 70%); background-size: 200% 100%; animation: shimmer 1.2s linear infinite; }
@keyframes shimmer { to { background-position: -200% 0; } }

/* ---------- Modal ---------- */
.modal-bg {
  position: fixed; inset: 0; z-index: 50; display: none; align-items: center; justify-content: center; padding: 16px;
  background: rgba(8,15,35,.55); backdrop-filter: blur(6px);
}
.modal-bg.open { display: flex; animation: fade .25s ease both; }
@keyframes fade { from { opacity: 0; } }
.modal {
  position: relative; width: 100%; max-width: 480px; max-height: 90vh; overflow: auto; border-radius: 22px; background: #fff;
  box-shadow: 0 30px 80px rgba(0,0,0,.4); animation: spring .45s cubic-bezier(.2,1.2,.3,1) both;
}
@keyframes spring { from { opacity: 0; transform: translateY(30px) scale(.9); } }
.m-head { padding: 22px 56px 16px 22px; color: #fff; background: linear-gradient(135deg, var(--c, #1e3a8a), #0b1f4d); }
.m-head h3 { margin: 0 0 4px; font-size: 20px; font-weight: 800; text-transform: uppercase; line-height: 1.25; }

.row { display: flex; justify-content: space-between; gap: 16px; padding: 10px 0; border-bottom: 1px dashed var(--line); font-size: 14px; animation: evIn .4s ease both; animation-delay: calc(var(--k) * 45ms + 120ms); }
.row:last-of-type { border-bottom: 0; }

.m-close { margin-top: 14px; width: 100%; padding: 13px; border: 0; border-radius: 12px; cursor: pointer; background: var(--navy); color: #fff; font-weight: 800; font-size: 14px; transition: transform .2s, background .2s; }
.m-close:hover { background: #12306f; transform: translateY(-2px); }
.g-row { padding: 10px 12px; margin-bottom: 8px; border-radius: 12px; background: var(--slate-bg); border-left: 4px solid var(--green); font-size: 13px; animation: evIn .4s ease both; animation-delay: calc(var(--k) * 45ms + 120ms); }

.print-title { display: none; }
mark { background: #fde047; color: inherit; border-radius: 4px; padding: 0 2px; box-shadow: 0 0 0 1px rgba(202,138,4,.35); animation: markIn .35s ease both; }
@keyframes markIn { from { background: #fb923c; } }
.rempty small { font-size: 12px; font-weight: 600; color: #94a3b8; }

/* ---------- Responsive ---------- */
@media (max-height: 820px) {
  .dnum { font-size: 30px; } .day-h { padding: 8px 12px 6px; } .top { padding: 7px 18px; } .logo { width: 36px; height: 36px; }

}

}
@media (max-width: 700px) {

  #grid.month .mc { min-height: 58px; padding: 4px; border-radius: 10px; }
  .mc-evs, .mc-more { display: none; }
  .mc-n { font-size: 14px; } .mc-n small { display: none; } .mh { letter-spacing: .02em; font-size: 10px; }
  .title small { display: none; } .weeklabel { min-width: 0; flex: 1; }
  .filters input[type="search"] { width: 100%; } .btn span.t { display: none; }
  .pop { position: fixed; left: 12px; right: 12px; top: auto; bottom: 12px; width: auto; max-width: none; }
  .pop::before { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
#grid.noanim .day, #grid.noanim .ev, #grid.noanim .grp, #grid.noanim .hl, #grid.noanim .mc, #grid.noanim .mh, #grid.noanim .rsum { animation: none; }

/* ---------- Print: A4 landscape ---------- */
@media print {
  @page { size: A4 landscape; margin: 8mm; }
  html, body { height: auto; background: #fff !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .top, .toolbar, .modal-bg, .err, .legend, .pop { display: none !important; }
  .app { height: auto; }
  .print-title { display: block; text-align: center; font-size: 17px; font-weight: 800; color: #1e3a8a; text-transform: uppercase; letter-spacing: .06em; padding: 0 0 6px; margin-bottom: 8px; border-bottom: 2px solid #1e3a8a; }
  .print-title small { display: block; font-size: 11px; color: #475569; letter-spacing: .12em; }
  main { padding: 0; display: block; }
  #grid { height: auto; grid-template-columns: repeat(4, 1fr); grid-template-rows: auto auto; gap: 6px; overflow: visible; }
  #grid.month { grid-template-columns: repeat(7, 1fr); grid-template-rows: auto !important; grid-auto-rows: minmax(70px, auto); gap: 3px; }
  #grid.rg { grid-template-columns: repeat(4, 1fr); overflow: visible; margin: 0; padding: 0; grid-auto-rows: auto; }
  .day, .hl, .mc, .rsum { break-inside: avoid; box-shadow: none !important; border: 1px solid #cbd5e1; animation: none !important; transform: none !important; opacity: 1 !important; }
  .day::after, .hl::before, .hl::after, .mc::after { display: none !important; }
  .evs, .hl-list { overflow: visible; }
  .ev, .grp { animation: none !important; opacity: 1 !important; transform: none !important; box-shadow: none !important; }
  .dnum { font-size: 26px; } .ev-name { font-size: 10px; } .ev-meta, .ev-time { font-size: 9px; } .pill { font-size: 7px; }
  .mchip { font-size: 8px; padding: 1px 4px; animation: none !important; } .mc-n { font-size: 12px; } .mc-more { font-size: 8px; }
  .rsum { color: #1e3a8a !important; background: #eef2ff !important; }
  .rsum-t, .rsum-s b { color: #1e3a8a !important; } .rsum-s span { color: #334155 !important; background: #fff !important; }
}

<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <div class="logo">🏨</div>
      <div class="title">Independence Hotel | F&amp;B Banquet Dashboard<small>EVENT CALENDAR</small></div>
    </div>
    <div class="actions">
      <span class="updated" id="updated"></span>
      <button class="btn" id="btnRefresh" title="Refresh data"><span class="ic">🔄</span><span class="t">Refresh</span></button>
      <button class="btn solid" id="btnPrint" title="Print / Save as PDF"><span class="ic">🖨️</span><span class="t">Export PDF</span></button>
    </div>
  </header>

  <div class="toolbar">
    <div class="seg" id="seg" data-active="week" role="tablist" aria-label="Layout">
      <span class="seg-thumb"></span>
      <button class="seg-b" data-mode="week" role="tab" aria-selected="true" title="Weekly view (W)">▦ Weekly</button>
      <button class="seg-b" data-mode="month" role="tab" aria-selected="false" title="Monthly view (M)">▤ Monthly</button>
    </div>

    <div class="weeknav" id="nav">
      <button class="nbtn" id="btnPrev" aria-label="Previous">◀</button>
      <div class="weeklabel"><small id="weekNo">WEEK</small><span id="weekRange">—</span></div>
      <button class="nbtn" id="btnNext" aria-label="Next">▶</button>
      <button class="nbtn today" id="btnToday">THIS WEEK</button>
    </div>

    <div class="range-wrap">
      <button class="rbtn" id="btnRange" aria-haspopup="dialog" aria-expanded="false"><span>📅</span><span id="rLabel">Custom range</span></button>
      <button class="rclear" id="btnRangeClear" aria-label="Clear custom range" title="Clear custom range">✕</button>
      <div class="pop" id="pop" role="dialog" aria-label="Custom date range">

          <button data-p="tomorrow">Tomorrow</button>

          <button class="pbtn ghost" id="rClear">Clear</button>
          <button class="pbtn" id="rApply">Apply range</button>

    </div>

    <div class="stats">
      <div class="stat">Events <b id="stAll" data-v="0">0</b></div>
      <div class="stat g">Confirmed <b id="stConf" data-v="0">0</b></div>

    <div class="filters">
      <input id="q" type="search" placeholder="🔍 Search group…" autocomplete="off">
      <select id="venue">
        <option value="all">📍 All Venues</option>

        <option value="camellia">Camelia Room</option>
        <option value="jasmine">Jasmine Room</option>
        <option value="champa">Champa Room</option>
        <option value="skypool">Sky Pool &amp; Poolside</option>

        <option value="beach">Beach</option>

      <select id="status">
        <option value="all">✅ All Status</option>
        <option value="confirmed">🟢 Confirmed</option>

  <div class="err" id="err" hidden></div>

  <main>

      <span><i style="background:#d97706"></i>Prospect</span>

</div>

<div class="modal-bg" id="modalBg" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true" id="modal"></div>

<script>
(function () {
  'use strict';

  const API_URL = 'https://script.google.com/macros/s/AKfycbw1F7SsSLEazvkYlZ0RZZ3D7Xzu8heAJh8xYBEQx5bB6WSkejYVY6jDJJrmqy9DdZVN4g/exec';
  const TZ = 'Asia/Phnom_Penh';
  const CACHE_KEY = 'banquetDash.v2';
  const MODE_KEY = 'banquetDash.mode';
  const MAX_RANGE_DAYS = 366;
  const DOW = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
  const DOWFULL = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const MON = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  const MONFULL = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const MIDX = { jan:0, feb:1, mar:2, apr:3, may:4, jun:5, jul:6, aug:7, sep:8, oct:9, nov:10, dec:11 };

  /* ================= Pure helpers (also used by tests) ================= */
  const pad = n => String(n).padStart(2, '0');
  const str = v => (v == null ? '' : String(v).trim());
  const oneLine = s => str(s).replace(/\s+/g, ' ');
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

  // Escape text and wrap case-insensitive matches of q (already lower-cased) in <mark>
  function hi(s, q) {
    s = String(s == null ? '' : s);
    if (!q) return esc(s);
    const l = s.toLowerCase();
    if (l.length !== s.length) return esc(s);
    let i = 0, out = '', k;
    while ((k = l.indexOf(q, i)) > -1) { out += esc(s.slice(i, k)) + '<mark>' + esc(s.slice(k, k + q.length)) + '</mark>'; i = k + q.length; }
    return out + esc(s.slice(i));
  }

  // Calendar key (YYYY-MM-DD) in the hotel's time zone — immune to viewer time-zone shifts.
  const pnhKey = d => new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year:'numeric', month:'2-digit', day:'2-digit' }).format(d);
  const parts = key => { const [y, m, d] = key.split('-').map(Number); return { y, m, d }; };
  const keyAdd = (key, n) => { const p = parts(key); return new Date(Date.UTC(p.y, p.m - 1, p.d + n)).toISOString().slice(0, 10); };
  const keyDow = key => { const p = parts(key); return new Date(Date.UTC(p.y, p.m - 1, p.d)).getUTCDay(); };
  const mondayOf = key => keyAdd(key, -((keyDow(key) + 6) % 7));
  const dayDiff = (a, b) => { const pa = parts(a), pb = parts(b); return Math.round((Date.UTC(pb.y, pb.m - 1, pb.d) - Date.UTC(pa.y, pa.m - 1, pa.d)) / 864e5); };
  const monthStartOf = key => key.slice(0, 7) + '-01';
  const nextMonthStart = key => { const p = parts(key); return new Date(Date.UTC(p.y, p.m, 1)).toISOString().slice(0, 10); };
  const prevMonthStart = key => { const p = parts(key); return new Date(Date.UTC(p.y, p.m - 2, 1)).toISOString().slice(0, 10); };
  const monthEndOf = key => keyAdd(nextMonthStart(key), -1);
  const monthLabel = key => { const p = parts(key); return `${MONFULL[p.m - 1].toUpperCase()} ${p.y}`; };
  function isoWeek(key) {
    const p = parts(key), dt = new Date(Date.UTC(p.y, p.m - 1, p.d));
    dt.setUTCDate(dt.getUTCDate() + 3 - ((dt.getUTCDay() + 6) % 7));
    const w1 = new Date(Date.UTC(dt.getUTCFullYear(), 0, 4));
    return 1 + Math.round(((dt - w1) / 864e5 - 3 + ((w1.getUTCDay() + 6) % 7)) / 7);
  }

  function toKey(v) {
    if (v == null || v === '') return null;
    const s = String(v).trim();
    let m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (m) return s;
    m = s.match(/^(\d{1,2})[-\/\s]([A-Za-z]{3,9})[-\/\s,]*(\d{4})$/);            // 24-Oct-2026
    if (m && MIDX[m[2].slice(0, 3).toLowerCase()] != null) return `${m[3]}-${pad(MIDX[m[2].slice(0, 3).toLowerCase()] + 1)}-${pad(+m[1])}`;
    const d = new Date(s);                                                          // ISO date-time etc.
    if (!isNaN(d) && d.getUTCFullYear() > 2000 && d.getUTCFullYear() < 2100) return pnhKey(d);
    return null;
  }

  function statusKey(s) {
    s = str(s).toLowerCase();
    if (!s) return 'none';
    if (s.startsWith('confirm') || s === 'definite') return 'confirmed';   // never matches "unconfirmed"
    if (s.includes('cancel')) return 'cancelled';
    if (s.includes('block')) return 'block';
    if (s.includes('prospect') || s.includes('tentative')) return 'prospect';
    return 'other';
  }
  const STATUS_LABEL = { confirmed:'CONFIRMED', prospect:'PROSPECT', cancelled:'CANCELLED', block:'BLOCKED', none:'NO STATUS' };
  const statusLabel = (sk, raw) => STATUS_LABEL[sk] || str(raw).toUpperCase();

  function venueKey(loc) {
    const l = str(loc).toLowerCase();
    if (l.includes('hibiscus')) return 'hibiscus';
    if (l.includes('camel')) return 'camellia';          // sheet spells it "Camelia"
    if (l.includes('jasmine')) return 'jasmine';
    if (l.includes('champa')) return 'champa';
    if (l.includes('sky') || l.includes('pool')) return 'skypool';
    if (l.includes('sunset')) return 'sunset';
    if (l.includes('coral')) return 'coral';
    if (l.includes('history')) return 'history';
    if (l.includes('beach')) return 'beach';
    return 'other';
  }
  const venueShort = loc => oneLine(loc).replace(/\s*(restaurant|room)\s*$/i, '').toUpperCase();
  const startMin = t => { const m = str(t).match(/(\d{1,2}):(\d{2})/); return m ? (+m[1]) * 60 + (+m[2]) : 9999; };
  const shortTime = e => { const m = str(e.time).match(/\d{1,2}:\d{2}/); return m ? m[0] : ''; };
  const sumNums = s => (str(s).match(/\d+/g) || []).reduce((a, b) => a + (+b), 0);
  const fmtTime = e => (str(e.time) ? str(e.time).replace(/\s*[-–]\s*/g, '–') : (statusKey(e.status) === 'block' ? 'ALL DAY' : 'TBA'));
  const byTime = (a, b) => startMin(a.time) - startMin(b.time) || a.group.localeCompare(b.group);

  const dayLabel = key => `${DOW[keyDow(key)]} ${parts(key).d}`;
  const longDate = key => { const p = parts(key); return `${DOWFULL[keyDow(key)]}, ${p.d} ${MONFULL[p.m - 1]} ${p.y}`; };
  function rangeLabel(a, b) {
    const pa = parts(a), pb = parts(b);

  function normalize(raw) {

  /* ---------- HTML builders ---------- */

  }

  function buildDay(key, i, events, today, f) {

    const all = events.filter(e => e.dateKey === key).sort(byTime);
    const shown = all.filter(e => passes(e, f));
    const hidden = (f.status === 'all' && !f.showAll)
      ? all.filter(e => passes(e, f, true) && ['cancelled', 'block'].includes(statusKey(e.status))).length : 0;
    const cls = ['day', key === today ? 'today' : '', key < today ? 'past' : '', (dow === 0 || dow === 6) ? 'weekend' : ''].join(' ').replace(/\s+/g, ' ').trim();
    const badge = key === today ? '<span class="badge-today">TODAY</span>' : '';
    const cnt = shown.length ? `<span class="cnt">${shown.length}</span>` : '';
    return `<section class="${cls}" style="--i:${i}" data-day="${key}">
      <div class="day-h">

    </section>`;
  }

  function buildHighlight(events, nextStart, f, reg) {
    const nextEnd = keyAdd(nextStart, 6);
    const list = events.filter(e => e.dateKey >= nextStart && e.dateKey <= nextEnd && statusKey(e.status) === 'confirmed' && passes(e, f, true)).sort((a, b) => a.dateKey.localeCompare(b.dateKey) || byTime(a, b));
    const groups = new Map();
    list.forEach(e => { const k = e.group.toLowerCase(); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(e); });
    const arr = [...groups.entries()].sort((a, b) => a[1][0].dateKey.localeCompare(b[1][0].dateKey));
    const cards = arr.map(([k, evs], j) => {
      reg.groups[k] = evs;
      const days = new Map(); evs.forEach(e => days.set(e.dateKey, (days.get(e.dateKey) || 0) + 1));
      const chips = [...days.entries()].map(([d, n]) => `<span class="chip">${dayLabel(d)}${n > 1 ? `<b>×${n}</b>` : ''}</span>`).join('');
      const venues = [...new Set(evs.map(e => venueShort(e.loc)).filter(Boolean))].join(' · ');

  function buildGrid(events, weekStart, today, f, reg) {

  // Month calendar: Mon–Sun header + whole weeks covering the month
  function monthRows(mStart) { return (dayDiff(mondayOf(mStart), keyAdd(mondayOf(monthEndOf(mStart)), 6)) + 1) / 7; }

  function buildMonth(events, mStart, today, f, cap) {
    const first = mondayOf(mStart), rows = monthRows(mStart), mEnd = monthEndOf(mStart);
    let html = '';

      const nShow = cap <= 0 ? 0 : (evs.length > cap ? Math.max(cap - 1, 1) : evs.length);
      const chips = evs.slice(0, nShow).map(e => {

        const tip = `${fmtTime(e)} · ${e.group}${e.loc ? ' · ' + oneLine(e.loc) : ''}${e.pax ? ' · ' + oneLine(e.pax) + ' pax' : ''} · ${statusLabel(sk, e.status)}`;
        return `<div class="mchip st-${sk}" data-ev="${e.id}" title="${esc(tip)}">${t ? `<b>${esc(t)}</b>` : ''}${esc(e.group)}</div>`;
      }).join('');
      const more = evs.length - nShow;
      const mon = (p.d === 1) ? `<small>${MON[p.m - 1]}</small>` : '';
      html += `<div class="${cls}" style="--i:${i}" data-day="${key}">
        <div class="mc-h"><span class="mc-n">${p.d}${mon}</span>${evs.length ? `<span class="mc-cnt">${evs.length}</span>` : ''}</div>
        <div class="mc-evs">${chips}</div>${more > 0 && cap > 0 ? `<div class="mc-more">+${more} more</div>` : ''}
      </div>`;

  }

  // Custom range: summary banner + one card per day (empty days hidden for very long ranges)
  function periodStats(events, from, to, f) {
    const wk = events.filter(e => e.dateKey >= from && e.dateKey <= to && passes(e, { q: f.q, venue: f.venue, status: 'all', showAll: false }));

  function buildRange(events, from, to, today, f) {

    const pros = shown.filter(e => statusKey(e.status) === 'prospect').length;
    let html = `<div class="rsum"><div class="rsum-t">📅 ${rangeLabel(from, to)}<small>${span} DAY${span > 1 ? 'S' : ''}</small></div>
      <div class="rsum-s"><span><b>${shown.length}</b>events</span><span><b>${conf.length}</b>confirmed</span><span><b>${pros}</b>prospect</span><span><b>${groups}</b>confirmed groups</span></div></div>`;
    if (!shown.length) return html + `<div class="rempty"><div class="sp">🗓️</div>No events in this range</div>`;

    for (let i = 0; i < span; i++) {

  }

    const n = shown.length;
    let html = `<div class="rsum"><div class="rsum-t">🔍 “${esc(raw)}”<small>${n} RESULT${n === 1 ? '' : 'S'}${scope ? ' · IN ' + esc(rangeLabel(scope.from, scope.to)) : ' · ALL DATES'}</small></div>
      <div class="rsum-s"><span><b>${groups}</b>group${groups === 1 ? '' : 's'}</span><span><b>${conf}</b>confirmed</span><span><b>${pros}</b>prospect</span></div></div>`;
    if (!n) return html + `<div class="rempty"><div class="sp">🔍</div>No matching groups${hiddenN > 0 ? `<br><small>${hiddenN} cancelled / blocked match — turn on “Show cancelled / blocked”</small>` : ''}</div>`;

  /* ================= App ================= */
  function init() {

      stAll: $('stAll'), stConf: $('stConf'), stPros: $('stPros'), updated: $('updated'), err: $('err'), modalBg: $('modalBg'), modal: $('modal'), printTitle: $('printTitle'),
      seg: $('seg'), nav: $('nav'), legend: $('legend'), btnRange: $('btnRange'), rLabel: $('rLabel'), btnRangeClear: $('btnRangeClear'), pop: $('pop'),

    function countUp(node, to) {

      const s = (searching && !state.range) ? periodStats(state.events, '0000-01-01', '9999-12-31', f) : periodStats(state.events, P.from, P.to, f);

    function renderSkeleton() {

      el.grid.style.gridTemplateRows = '';

    }

    function openModal(head, body) {
      el.modal.innerHTML = `<button class="m-x" aria-label="Close">✕</button>${head}<div class="m-body">${body}<button class="m-close">Close</button></div>`;
      el.modal.scrollTop = 0;
      el.modalBg.classList.add('open'); el.modalBg.setAttribute('aria-hidden', 'false');
    }
    function closeModal() { el.modalBg.classList.remove('open'); el.modalBg.setAttribute('aria-hidden', 'true'); }
    const colors = { confirmed:'#15803d', prospect:'#b45309', cancelled:'#b91c1c', block:'#475569', none:'#1d4ed8', other:'#6d28d9' };

    function openEvent(e) {
      if (!e) return;
      const sk = statusKey(e.status);
      openModal(
        `<div class="m-head" style="--c:${colors[sk]}"><h3>${esc(e.group)}</h3><p>📅 ${longDate(e.dateKey)} · ⏰ ${esc(fmtTime(e))}</p></div>`,
        row('Res. Code', esc(e.code), 0) + row('Venue', esc(e.loc || 'TBA'), 1) + row('Type of event', esc(e.type), 2) +
        row('Pax', esc(e.pax), 3) +
        row('Status', `<span style="color:${colors[sk]}">${esc(statusLabel(sk, e.status))}</span>`, 4) +
        row('Remark', esc(e.remark), 5)
      );
    }
    function openGroup(key) {
      const evs = state.reg.groups[key]; if (!evs) return;
      const rows = evs.map((e, i) => `<div class="g-row" style="--k:${i}"><b>${longDate(e.dateKey)} · ${esc(fmtTime(e))}</b>📍 ${esc(e.loc || 'TBA')}${e.type ? ' · ' + esc(oneLine(e.type)) : ''}${e.pax ? ' · 👥 ' + esc(oneLine(e.pax)) : ''}</div>`).join('');
      openModal(`<div class="m-head" style="--c:#15803d"><h3>${esc(evs[0].group)}</h3><p>🟢 Confirmed · ${evs.length} event${evs.length > 1 ? 's' : ''} next week</p></div>`, rows);
    }
    function openDay(key) {
      const f = filters();
      const evs = state.events.filter(e => e.dateKey === key && passes(e, f, true)).sort(byTime);
      if (!evs.length) return;
      const n = evs.filter(e => statusKey(e.status) === 'confirmed').length;
      openModal(`<div class="m-head" style="--c:#1d4ed8"><h3>${longDate(key)}</h3><p>${evs.length} event${evs.length > 1 ? 's' : ''}${n ? ` · 🟢 ${n} confirmed` : ''}</p></div>`,
        evs.map((e, j) => evCard(e, j)).join(''));
    }

    /* ----- Data ----- */
    function showError(msg) {
      el.err.hidden = false;
      el.err.innerHTML = `❌ <strong>Connection error:</strong> ${esc(msg)}${state.events.length ? ' — showing last saved data.' : ''}<br><small>សូមប្រាកដថា Google Script Web App ត្រូវបានសិទ្ធិជា 'Anyone' និង URL ត្រឹមត្រូវ។</small>`;
    }
    const clock = d => new Intl.DateTimeFormat('en-GB', { timeZone: TZ, hour: '2-digit', minute: '2-digit' }).format(d);

    async function fetchEvents() {
      el.btnRefresh.classList.add('loading');
      try {
        const r = await fetch(API_URL, { redirect: 'follow' });
        if (!r.ok) throw new Error('Network response failed: ' + r.status);
        const json = await r.json();
        if (!Array.isArray(json)) throw new Error(json && json.error ? json.error : 'Unexpected response format');
        state.events = normalize(json);
        state.updated = new Date();
        el.updated.textContent = 'Updated ' + clock(state.updated);
        el.err.hidden = true;
        try { localStorage.setItem(CACHE_KEY, JSON.stringify(json)); } catch (_) {}
        render(true);
      } catch (e) {
        showError(e.message || e);
        if (!state.events.length) el.grid.innerHTML = '';
      } finally {
        el.btnRefresh.classList.remove('loading');
      }
    }

    /* ----- Events ----- */
    el.seg.addEventListener('click', e => { const b = e.target.closest('.seg-b'); if (b) setMode(b.dataset.mode); });
    el.btnPrev.onclick = () => go(-1);
    el.btnNext.onclick = () => go(1);
    el.btnToday.onclick = goToday;
    el.btnRefresh.onclick = fetchEvents;
    el.btnPrint.onclick = () => window.print();
    el.q.addEventListener('input', () => { render(false); if (el.pop.classList.contains('open')) updateInfo(); });
    el.q.addEventListener('keydown', ev => { if (ev.key === 'Escape' && el.q.value) { ev.stopPropagation(); el.q.value = ''; render(true, 0); } });
    [el.venue, el.status, el.showAll].forEach(n => n.addEventListener('change', () => { render(false); if (el.pop.classList.contains('open')) updateInfo(); }));

    el.grid.addEventListener('click', ev => {
      const c = ev.target.closest('[data-ev]'); if (c) return openEvent(state.events[+c.dataset.ev]);
      const g = ev.target.closest('[data-grp]'); if (g) return openGroup(g.dataset.grp);
      const m = ev.target.closest('.mc.has'); if (m) openDay(m.dataset.day);
    });
    el.grid.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' ') { const t = ev.target.closest('[data-ev],[data-grp]'); if (t) { ev.preventDefault(); t.click(); } } });
    el.modalBg.addEventListener('click', ev => {
      const c = ev.target.closest('[data-ev]'); if (c) return openEvent(state.events[+c.dataset.ev]);
      if (ev.target === el.modalBg || ev.target.closest('.m-x') || ev.target.closest('.m-close')) closeModal();
    });
    document.addEventListener('keydown', ev => {
      if (ev.key === 'Escape') { closeModal(); closePop(); return; }
      if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
      if (ev.key === '/' && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) { ev.preventDefault(); el.q.focus(); return; }
      if (el.modalBg.classList.contains('open') || /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) return;
      const k = ev.key.toLowerCase();
      if (k === 'arrowleft') go(-1); else if (k === 'arrowright') go(1);
      else if (k === 'w') setMode('week'); else if (k === 'm') setMode('month'); else if (k === 't') goToday();
    });

    // Re-fit month cells when the window size changes
    let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if (state.mode === 'month' && !state.range) render(false); }, 150); });

    // Roll over at midnight and keep data fresh
    let lastToday = todayKey();
    setInterval(() => {
      const t = todayKey();
      if (t !== lastToday) { lastToday = t; if (state.follow) { state.weekStart = mondayOf(t); state.monthStart = monthStartOf(t); } render(false); }
    }, 30000);
    setInterval(fetchEvents, 5 * 60 * 1000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden && (!state.updated || Date.now() - state.updated > 120000)) fetchEvents(); });

    /* ----- Start: show cached data instantly, then refresh ----- */
    let cached = null;
    try { cached = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); } catch (_) {}
    if (Array.isArray(cached) && cached.length) { state.events = normalize(cached); render(true); } else { renderSkeleton(); }
    fetchEvents();
  }

  if (typeof document !== 'undefined') document.addEventListener('DOMContentLoaded', init);
})();
</script>
</body>
</html>
