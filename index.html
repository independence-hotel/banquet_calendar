<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banquet Event Calendar Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .modal { display: none; }
        .modal.active { display: flex; }
    </style>
</head>
<body class="bg-gray-50 text-slate-800 font-sans">
    <!-- Navbar -->
    <nav class="bg-blue-900 text-white p-4 shadow-md flex justify-between items-center">
        <h1 class="text-xl font-bold">F&B Banquet Dashboard</h1>
        <div class="space-x-4">
            <button class="bg-white text-blue-900 px-4 py-2 rounded font-semibold hover:bg-blue-100" onclick="window.print()">Export PDF</button>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container mx-auto mt-8 p-4">
        <!-- Controls -->
        <div class="flex justify-between items-center mb-6">
            <div class="flex space-x-2">
                <button class="px-4 py-2 bg-blue-800 text-white rounded shadow hover:bg-blue-700" onclick="fetchEvents()">Refresh Data</button>
            </div>
            <div class="flex space-x-4">
                <select id="venueFilter" class="border p-2 rounded text-gray-700" onchange="renderEvents()">
                    <option value="all">All Venues</option>
                    <option value="coral">Coral</option>
                    <option value="sunset">Sunset</option>
                    <option value="camelia">Camelia Room</option>
                    <option value="hibiscus">Hibiscus Room</option>
                    <option value="jasmine">Jasmine Room</option>
                </select>
            </div>
        </div>

        <!-- Event List View -->
        <div class="bg-white shadow rounded-lg p-6">
            <h2 class="text-2xl font-bold mb-4 text-blue-900">Upcoming Events</h2>
            <div id="eventContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <div class="col-span-full text-center py-8">
                    <div class="animate-spin inline-block w-8 h-8 border-[3px] border-current border-t-transparent text-blue-600 rounded-full" role="status" aria-label="loading"></div>
                    <p class="mt-2 text-gray-500">Loading events from Google Sheets...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal for Event Details -->
    <div id="eventModal" class="modal fixed inset-0 bg-black bg-opacity-50 justify-center items-center z-50">
        <div class="bg-white p-8 rounded-lg shadow-xl max-w-md w-full m-4">
            <h3 id="modalTitle" class="text-2xl font-bold text-blue-900 mb-2">Event Name</h3>
            <p id="modalDate" class="text-gray-600 mb-4 font-semibold"></p>
            <div class="space-y-3 mb-6 bg-gray-50 p-4 rounded-lg">
                <p class="flex justify-between"><strong>Res. Code:</strong> <span id="modalCode" class="text-gray-700"></span></p>
                <p class="flex justify-between"><strong>Venue:</strong> <span id="modalVenue" class="text-gray-700"></span></p>
                <p class="flex justify-between"><strong>Pax:</strong> <span id="modalPax" class="text-gray-700"></span></p>
                <p class="flex justify-between"><strong>Event Type:</strong> <span id="modalType" class="text-gray-700"></span></p>
                <p class="flex justify-between"><strong>Status:</strong> <span id="modalStatus" class="font-bold"></span></p>
            </div>
            <button class="bg-blue-900 hover:bg-blue-800 text-white px-4 py-2 rounded w-full font-bold transition-colors" onclick="closeModal()">Close</button>
        </div>
    </div>

    <script>
        // ⚠️ ប្តូរ URL ខាងក្រោមទៅជា URL ថ្មីដែលបាន Deploy ពី Apps Script (ត្រូវបញ្ចប់ដោយ /exec)
        const API_URL = 'https://script.google.com/macros/s/AKfycbw1F7SsSLEazvkYlZ0RZZ3D7Xzu8heAJh8xYBEQx5bB6WSkejYVY6jDJJrmqy9DdZVN4g/exec';
        let eventsData = [];

        async function fetchEvents() {
            const container = document.getElementById('eventContainer');
            container.innerHTML = `
                <div class="col-span-full text-center py-8">
                    <div class="animate-spin inline-block w-8 h-8 border-[3px] border-current border-t-transparent text-blue-600 rounded-full"></div>
                    <p class="mt-2 text-gray-500">Refreshing data...</p>
                </div>`;

            try {
                // ប្រើ redirect: 'follow' សម្រាប់ Google Script
                const response = await fetch(API_URL, { redirect: 'follow' });
                if (!response.ok) throw new Error('Network response was not ok');
                eventsData = await response.json();
                
                // តម្រៀបតាមកាលបរិច្ឆេទ
                eventsData.sort((a, b) => new Date(a.date) - new Date(b.date));
                renderEvents();
            } catch (error) {
                console.error('Fetch error:', error);
                container.innerHTML = `<div class="col-span-full bg-red-50 p-4 rounded-lg text-red-600 text-center font-semibold">❌ Error loading data. Please check if the Google Script URL is correct and deployed as 'Anyone'.</div>`;
            }
        }

        function renderEvents() {
            const container = document.getElementById('eventContainer');
            const venueFilter = document.getElementById('venueFilter').value.toLowerCase();
            container.innerHTML = '';

            const filteredEvents = eventsData.filter(ev => {
                if (venueFilter === 'all') return true;
                return ev.location.toLowerCase().includes(venueFilter);
            });

            if (filteredEvents.length === 0) {
                container.innerHTML = `<p class="col-span-full text-center text-gray-500 py-8">No events found for the selected filter.</p>`;
                return;
            }

            filteredEvents.forEach((ev, index) => {
                const isConfirmed = ev.status.includes('confirm');
                // Theme colors (Green for confirmed, Orange for others)
                const bgColor = isConfirmed ? 'bg-green-50 border-green-500' : 'bg-orange-50 border-orange-400';
                const badgeColor = isConfirmed ? 'bg-green-100 text-green-800' : 'bg-orange-100 text-orange-800';

                // Format Date nicely
                let displayDate = "TBA";
                if(ev.date) {
                    const d = new Date(ev.date);
                    if(!isNaN(d)) displayDate = d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
                }

                const card = document.createElement('div');
                card.className = `border-l-4 p-5 rounded-lg shadow-sm cursor-pointer hover:shadow-md transition-all duration-200 ${bgColor}`;
                card.onclick = () => openModal(index, filteredEvents);
                
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-2">
                        <h4 class="font-bold text-lg text-blue-900 leading-tight flex-1">${ev.groupName}</h4>
                    </div>
                    <p class="text-sm text-gray-600 font-medium mb-1 flex items-center">
                        📅 ${displayDate} | ⏰ ${ev.time}
                    </p>
                    <p class="text-sm text-gray-600 mb-3 flex items-center">
                        📍 ${ev.location || 'TBA'} 
                    </p>
                    <div class="flex justify-between items-center mt-2">
                        <span class="text-xs font-semibold px-2.5 py-1 rounded ${badgeColor}">${ev.status.toUpperCase() || 'NO STATUS'}</span>
                        <span class="text-sm font-medium text-gray-500">👥 ${ev.pax || '?'}</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function openModal(index, dataArray) {
            const ev = dataArray[index];
            
            // Format Date for Modal
            let displayDate = "TBA";
            if(ev.date) {
                const d = new Date(ev.date);
                if(!isNaN(d)) displayDate = d.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
            }

            document.getElementById('modalTitle').innerText = ev.groupName;
            document.getElementById('modalDate').innerText = `📅 ${displayDate} | ⏰ ${ev.time}`;
            document.getElementById('modalCode').innerText = ev.reservationCode || 'N/A';
            document.getElementById('modalVenue').innerText = ev.location || 'TBA';
            document.getElementById('modalPax').innerText = ev.pax || 'TBA';
            document.getElementById('modalType').innerText = ev.type || 'N/A';
            document.getElementById('modalStatus').innerText = ev.status.toUpperCase() || 'UNKNOWN';
            
            const isConfirmed = ev.status.includes('confirm');
            document.getElementById('modalStatus').className = isConfirmed ? 'text-green-600 font-bold' : 'text-orange-500 font-bold';

            document.getElementById('eventModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('eventModal').classList.remove('active');
        }

        // Fetch data on load
        fetchEvents();
    </script>
</body>
</html>
